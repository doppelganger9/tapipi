<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tapis — éditeur de jeu</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/editor.css">
</head>
<body>
  <header class="topbar">
    <strong class="brand">Tapis</strong><span>Éditeur de jeu</span>
    <span id="validity" class="validity"></span>
    <span class="spacer"></span>
    <button id="newBtn">Nouveau</button>
    <button id="importBtn">Importer</button><input id="importFile" type="file" accept=".json,application/json" hidden>
    <button id="exportBtn">Exporter le fichier</button>
    <a id="playBtn" class="button primary-link" href="/">Jouer avec ce jeu →</a>
  </header>
  <div class="editor">
    <section class="panel">
      <h2>Le jeu</h2>
      <label>Nom <input id="g-name" maxlength="60"></label>
      <label>Description <input id="g-description" maxlength="300"></label>
      <div class="two">
        <label>Joueurs min <input id="g-min" type="number" min="1" max="8"></label>
        <label>Joueurs max <input id="g-max" type="number" min="1" max="8"></label>
      </div>
      <label>Couleur du tapis <input id="g-felt" type="color"></label>
      <label class="check"><input id="g-unboxing" type="checkbox"> Boîte scellée à déballer avant la première partie</label>
      <label>Règles <textarea id="g-rules" rows="10"></textarea></label>
      <p class="hint left">Zones et compteurs se règlent dans le fichier exporté (voir le README). L'éditeur les conserve tels quels.</p>
    </section>
    <section class="panel">
      <div class="tabs" role="tablist">
        <button id="tabCards" class="tab on" role="tab">Cartes et pièces</button>
        <button id="tabScripts" class="tab" role="tab">Scripts et mise en place</button>
      </div>
      <div id="scriptsView" hidden></div>
      <div id="cardsView">
      <div class="row"><h2>Paquet</h2><select id="deck" aria-label="Paquet"></select><span class="spacer"></span>
        <button id="addBtn" class="primary">+ Carte</button></div>
      <div id="cards" class="thumbs"></div>
      </div>
    </section>
    <section class="panel" id="cardPanel">
      <h2>La carte</h2>
      <div id="cardPreview" class="preview"></div>
      <form id="cardForm">
        <label>Nom <input name="name" maxlength="60"></label>
        <div class="two">
          <label>Type <input name="type" maxlength="40"></label>
          <label>Coût / valeur <input name="cost" maxlength="6"></label>
        </div>
        <div class="two">
          <label>Symbole (emoji, chiffre) <input name="art" maxlength="16"></label>
          <label>Force / stats <input name="stats" maxlength="16"></label>
        </div>
        <label>Texte <textarea name="text" rows="3" maxlength="600"></textarea></label>
        <div class="two">
          <label>Couleur <input name="color" type="color"></label>
          <label>Exemplaires <input name="count" type="number" min="1" max="99"></label>
        </div>
        <div class="two">
          <label>Forme <select name="shape"><option value="card">Carte</option><option value="square">Tuile carrée</option><option value="round">Pion rond</option></select></label>
          <label>Taille <input name="size" type="number" min="0.3" max="3" step="0.1"></label>
        </div>
        <div class="row">
          <button type="button" id="imageBtn">Illustration…</button><input id="imageFile" type="file" accept="image/*" hidden>
          <button type="button" id="imageClear">Retirer l'image</button>
        </div>
        <div class="row"><button type="button" id="dupBtn">Dupliquer</button><button type="button" id="delBtn">Supprimer</button></div>
      </form>
    </section>
  </div>
  <div id="toast" class="toast" hidden role="alert"></div>
  <script type="module" src="/js/editor.js"></script>
</body>
</html>
